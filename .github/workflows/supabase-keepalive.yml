name: Supabase activity check

on:
  schedule:
    - cron: '0 6,12,18 * * *'
  workflow_dispatch:

jobs:
  database-health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check backend and database
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "Configure BACKEND_URL in the repository Actions secrets."
            exit 1
          fi
          curl --fail --silent --show-error --retry 2 --retry-delay 5 \
            "${BACKEND_URL%/}/api/health"
